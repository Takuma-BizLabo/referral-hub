<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>セールスハブ連携</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; font-size: 13px; width: 320px; margin: 0; padding: 14px; color: #1f2937; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; font-size: 11px; color: #6b7280; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 8px; font-size: 12px; }
  button { margin-top: 10px; width: 100%; border: 0; border-radius: 6px; padding: 8px; font-weight: 600; cursor: pointer; }
  .primary { background: #2f5bff; color: #fff; }
  .secondary { background: #f3f4f6; color: #1f2937; margin-top: 6px; }
  .status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f9fafb; border: 1px solid #e5e7eb; font-size: 12px; white-space: pre-wrap; }
  .ok { border-color: #a7f3d0; background: #ecfdf5; }
  .ng { border-color: #fecaca; background: #fef2f2; }
  .hint { color: #6b7280; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>紹介案件管理 セールスハブ連携</h1>
  <label>ツールのURL</label>
  <input id="appUrl" placeholder="https://xxxx.up.railway.app">
  <label>接続トークン</label>
  <input id="token" placeholder="設定 → セールスハブ連携 に表示されるトークン">
  <button class="primary" id="save">保存</button>
  <button class="secondary" id="sync">今すぐ同期</button>
  <div class="status" id="status">状態を読み込み中...</div>
  <p class="hint">Chrome が起動している間、5分おきに自動で同期します。セールスハブにログインした状態にしておいてください。</p>
  <script src="popup.js"></script>
</body>
</html>
